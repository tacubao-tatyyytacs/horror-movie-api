<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Movie API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Horror Movie API</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#movies">Movies</a>
        <a href="#addMovie">Add Movie</a>
    </nav>
</header>

<main>

    <section id="home" class="hero">
        <h2>Horror Movie Collection</h2>
        <p>Browse and manage horror movies.</p>

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            >
            <button id="searchButton">Search</button>
        </div>
    </section>

    <section id="addMovie" class="form-section">

        <h2>Add New Movie</h2>

        <div id="formMessage"></div>

        <form id="addMovieForm">

            <label for="title">Title</label>
            <input type="text" id="title" required>

            <label for="release_year">Release Year</label>
            <input type="number" id="release_year" required>

            <label for="duration">Duration (minutes)</label>
            <input type="number" id="duration" required>

            <label for="rating">Rating</label>
            <input
                type="number"
                id="rating"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <label for="description">Description</label>
            <textarea id="description" required></textarea>

            <label for="director_id">Director</label>
            <select id="director_id" required>
                <option value="">Loading directors...</option>
            </select>

            <label for="genre_id">Genre</label>
            <select id="genre_id" required>
                <option value="">Select a genre</option>
            </select>

            <button type="submit">Add Movie</button>

        </form>

    </section>

    <section id="editMovie" class="form-section hidden">

        <h2>Edit Movie</h2>

        <div id="editMessage"></div>

        <form id="editMovieForm">

            <input type="hidden" id="editMovieId">

            <label for="editTitle">Title</label>
            <input type="text" id="editTitle" required>

            <label for="editReleaseYear">Release Year</label>
            <input type="number" id="editReleaseYear" required>

            <label for="editDuration">Duration (minutes)</label>
            <input type="number" id="editDuration" required>

            <label for="editRating">Rating</label>
            <input
                type="number"
                id="editRating"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <label for="editDescription">Description</label>
            <textarea id="editDescription" required></textarea>

            <label for="editDirectorId">Director</label>
            <select id="editDirectorId" required>
                <option value="">Loading directors...</option>
            </select>

            <button type="submit">Update Movie</button>
            <button type="button" id="cancelEdit">Cancel</button>

        </form>

    </section>

    <section id="movies">

        <h2>Movies</h2>

        <p id="message">Loading movies...</p>

        <div id="movieGrid"></div>

    </section>

    <section id="details" class="hidden">

        <button id="backButton">← Back to Movies</button>

        <div id="movieDetails"></div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
